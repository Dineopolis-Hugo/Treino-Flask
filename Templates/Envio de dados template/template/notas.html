<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas</title>
</head>
<body>
    <h1>Boletim Matemática</h1>
    <form action=" http://127.0.0.1:5000/calculo " method="post">
    {% for x in range(4) %}
    <p>
    <input type="number"min="0" max="10" name="nota{{x+1}}" placeholder="nota {{x+1}}" id="nota {{x+1}}" required>
      {% endfor %}
</p>
  
    <p>
    <button type="submit">enviar</button>
    </p>
    </form>
</body>
</html>
